<svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" width="100%" role="img">
  <title>How Pranshu builds: Research to Product pipeline</title>
  <desc>An animated signal travels through five stages: Research, Data, Models, Reasoning, Product — looping continuously to represent an iterative build process.</desc>

  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2a5c"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3a2a5c"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8D5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9D7FD4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="900" height="180" fill="#0a0a0f"/>

  <!-- connecting line -->
  <line x1="80" y1="70" x2="820" y2="70" stroke="url(#lineGrad)" stroke-width="2"/>

  <!-- stage nodes -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- node 1 -->
    <circle cx="80" cy="70" r="7" fill="#9D7FD4"/>
    <text x="80" y="110" fill="#c9d1d9" font-size="14" text-anchor="middle">Research</text>
    <text x="80" y="128" fill="#7d7d8a" font-size="10" text-anchor="middle">problem framing</text>

    <!-- node 2 -->
    <circle cx="265" cy="70" r="7" fill="#9D7FD4"/>
    <text x="265" y="110" fill="#c9d1d9" font-size="14" text-anchor="middle">Data</text>
    <text x="265" y="128" fill="#7d7d8a" font-size="10" text-anchor="middle">schema, not chaos</text>

    <!-- node 3 -->
    <circle cx="450" cy="70" r="7" fill="#9D7FD4"/>
    <text x="450" y="110" fill="#c9d1d9" font-size="14" text-anchor="middle">Models</text>
    <text x="450" y="128" fill="#7d7d8a" font-size="10" text-anchor="middle">deterministic where possible</text>

    <!-- node 4 -->
    <circle cx="635" cy="70" r="7" fill="#9D7FD4"/>
    <text x="635" y="110" fill="#c9d1d9" font-size="14" text-anchor="middle">Reasoning</text>
    <text x="635" y="128" fill="#7d7d8a" font-size="10" text-anchor="middle">AI where it earns its keep</text>

    <!-- node 5 -->
    <circle cx="820" cy="70" r="7" fill="#9D7FD4"/>
    <text x="820" y="110" fill="#c9d1d9" font-size="14" text-anchor="middle">Product</text>
    <text x="820" y="128" fill="#7d7d8a" font-size="10" text-anchor="middle">shipped, with a live URL</text>
  </g>

  <!-- traveling signal -->
  <circle r="9" fill="url(#nodeGlow)">
    <animateMotion dur="9s" repeatCount="indefinite"
      path="M80,70 L265,70 L450,70 L635,70 L820,70 L820,70" />
  </circle>
  <circle r="3.5" fill="#F4EBFF">
    <animateMotion dur="9s" repeatCount="indefinite"
      path="M80,70 L265,70 L450,70 L635,70 L820,70 L820,70" />
  </circle>

  <text x="450" y="165" fill="#5a5a68" font-size="11" text-anchor="middle" font-style="italic">
    the signal loops — every shipped product restarts this cycle
  </text>
</svg>
